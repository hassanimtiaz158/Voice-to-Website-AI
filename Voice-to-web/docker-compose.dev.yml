services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/srv
      - workspaces:/data/workspaces
  worker:
    volumes:
      - ./apps/api:/srv
      - workspaces:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
  web:
    build:
      context: ./apps/web
      target: dev
    command: npm run dev -- --host
    ports: ["5173:5173"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
